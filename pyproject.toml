[project]
name = "doctolib-monitor"
version = "0.1.0"
description = "Doctolib Germany (doctolib.de) Real-Time Appointment Sniper, Public vs. Private Wait-Time Monitor & Pluggable Booking Automator"
readme = "README.md"
authors = [
    { name = "Paprika", email = "doginnet@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.17.0",
    "fastapi>=0.162.0",
    "loguru>=0.7.3",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pydeck>=0.9.3",
    "pytest>=9.2.0",
    "rich>=15.0.0",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
doctolib-monitor = "doctolib_monitor:main"
doctolib-web = "doctolib_monitor:run_web"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: Offline unit tests using local JSON fixtures and temporary SQLite databases",
    "live: Live network smoke tests hitting doctolib.de endpoints with cache-busting headers",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
